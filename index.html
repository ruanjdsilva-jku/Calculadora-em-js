<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="calculadora.css">
</head>
<body>
<div id="calculadora">
    <div id="visualização">
        <div id="contas">
            <p id="calculo"></p>
            <p id="resultado"></p>
        </div>
    </div>
    <div id="numeros">
         <p id="all">all</p>
    <p id="clear">c</p>
    <p></p>
    <p class="operador">x</p>

    <p class="numero">1</p>
    <p class="numero">2</p>
    <p class="numero">3</p>
    <p class="operador">/</p>

    <p class="numero">4</p>
    <p class="numero">5</p>
    <p class="numero">6</p>
    <p class="operador">+</p>

    <p class="numero">7</p>
    <p class="numero">8</p>
    <p class="numero">9</p>

    <p class="numero">0</p>
    <p class="operador">-</p>
    <p id="igual">=</p>
    <p></p>
    <p></p>

    </div>
</div>
<script src="calculadora.js"></script>
</body>
</html>
